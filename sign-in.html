<!doctype html>
<html class="no-js" lang="en">
  <head>
    <!-- Meta Tags -->
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Thememarch" />
    <meta name="description" content="Pet Care Services HTML Template" />
    <!-- Site Title -->
    <title>Patie - Pet Care Services HTML Template</title>
    <!-- Favicon Icon -->
    <link rel="icon" href="assets/img/logo/favIcon.svg" />

    <link rel="stylesheet" href="assets/css/preloader.css" />
    <link rel="stylesheet" href="assets/css/plugins/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/plugins/fontawesome.min.css" />
    <link rel="stylesheet" href="assets/css/plugins/aos.css" />
    <link rel="stylesheet" href="assets/css/plugins/swiper.min.css" />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>

    <!-- Preloader -->
    <div
      id="preloader"
      class="preloader"
      aria-hidden="true"
      role="presentation"
    >
      <div class="preloader__frames">
        
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf0" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf1" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf2" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf3" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf4" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf5" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf6" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf7" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf8" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf9" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf10" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf11" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf12" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf13" />
        </svg>
      </div>
    </div>

    <!-- ================= Start Sign In ========================== -->
    <section class="sign-in">
      <div class="sign-in__inner">
        <div class="sign-in__form-panel">
          <a href="index.html" class="sign-in__logo" aria-label="Patie Home">
            <img
              src="assets/img/logo/dashboard-logo.svg"
              alt="Paties"
              width="220"
              height="52"
            />
          </a>

          <div class="sign-in__form-content">
            <h1 class="sign-in__title">Sign In</h1>

            <form
              class="sign-in__form"
              action="#"
              method="post"
              novalidate
              aria-label="Sign in"
            >
              <div class="sign-in__input-wrapper">
                <input
                  id="si-email"
                  class="sign-in__input"
                  type="email"
                  name="email"
                  placeholder="Enter Email Address"
                  autocomplete="email"
                  required
                />
                <i
                  class="far fa-envelope sign-in__input-icon"
                  aria-hidden="true"
                ></i>
              </div>

              <div class="sign-in__input-wrapper">
                <input
                  id="si-password"
                  class="sign-in__input"
                  type="password"
                  name="password"
                  placeholder="Password"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  class="sign-in__eye-toggle"
                  aria-label="Show password"
                  data-target="si-password"
                >
                  <i class="fas fa-lock" aria-hidden="true"></i>
                </button>
              </div>
              <a href="forget-password.html" class="sign-in__forgot-link"
                >Forgot Password?</a
              >

              <button
                type="submit"
                class="common-btn common-btn--primary sign-in__submit-btn"
              >
                <span class="common-btn__inner">
                  Sign In
                  <svg
                    class="common-btn__dash-svg"
                    viewBox="0 0 170 47"
                    preserveAspectRatio="none"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <rect
                      x="1.5"
                      y="1.5"
                      width="167"
                      height="44"
                      rx="22"
                      ry="22"
                    />
                  </svg>
                </span>
              </button>
            </form>

            <p class="sign-in__register-wrap">
              Don't Have An Account?
              <a href="sign-up.html" class="sign-in__register-link">Sign Up</a>
            </p>
          </div>
        </div>

        <div class="sign-in__image-panel">
          <div class="sign-in__image-box">
            <img
              src="assets/img/sign-in/sign-in.png"
              alt="Pets"
              class="sign-in__image"
            />
          </div>
        </div>
      </div>
    </section>
    <!-- ================= End Sign In ============================ -->

    <!-- Script -->
    <script src="assets/js/plugins/jquery-3.7.1.min.js"></script>
    <script src="assets/js/plugins/gsap.min.js"></script>
    <script src="assets/js/plugins/ScrollTrigger.min.js"></script>
    <script src="assets/js/plugins/chart.umd.min.js"></script>
    <script src="assets/js/plugins/chartjs-plugin-datalabels.min.js"></script>
    <script src="assets/js/plugins/aos.js"></script>
    <script src="assets/js/plugins/swiper.min.js"></script>
    <script src="assets/js/plugins/SplitText.min.js"></script>
    <script src="assets/js/paw-sprite.js"></script>

    <script src="assets/js/main.js"></script>
  </body>
</html>
