<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Thememarch" />
    <link rel="icon" href="assets/img/logo/favIcon.svg" />
    <title>Sign Up – Patie</title>
    <link rel="stylesheet" href="assets/css/plugins/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/plugins/fontawesome.min.css" />
    <link rel="stylesheet" href="assets/css/preloader.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- Preloader -->
    <div
      id="preloader"
      class="preloader"
      aria-hidden="true"
      role="presentation"
    >
      <div class="preloader__frames">
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf0" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf1" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf2" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf3" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf4" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf5" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf6" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf7" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf8" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf9" />
        </svg>
      </div>
    </div>

    <!-- ================= Start Sign Up ========================== -->
    <section class="sign-up">
      <div class="sign-up__inner">
        <div class="sign-up__form-panel">
          <a href="index.html" class="sign-up__logo" aria-label="Patie Home">
            <img
              src="assets/img/logo/dashboard-logo.svg"
              alt="Paties"
              width="220"
              height="52"
            />
          </a>

          <div class="sign-up__form-content">
            <h1 class="sign-up__title">Sign Up</h1>

            <form
              class="sign-up__form"
              action="#"
              method="post"
              novalidate
              aria-label="Sign up"
            >
              <div class="sign-up__field">
                <label class="sign-up__label" for="su-name">Full Name*</label>
                <div class="sign-up__input-wrapper">
                  <input
                    id="su-name"
                    class="sign-up__input"
                    type="text"
                    name="full_name"
                    placeholder="Jonaid Islam"
                    autocomplete="name"
                    required
                  />
                </div>
              </div>

              <div class="sign-up__field">
                <label class="sign-up__label" for="su-email"
                  >Enter Email Address*</label
                >
                <div class="sign-up__input-wrapper">
                  <input
                    id="su-email"
                    class="sign-up__input"
                    type="email"
                    name="email"
                    placeholder="Jonaid@Gmail.Com"
                    autocomplete="email"
                    required
                  />
                </div>
              </div>

              <div class="sign-up__field">
                <label class="sign-up__label" for="su-phone"
                  >Phone Number*</label
                >
                <div class="sign-up__input-wrapper">
                  <input
                    id="su-phone"
                    class="sign-up__input"
                    type="tel"
                    name="phone"
                    placeholder="+00011 22365"
                    autocomplete="tel"
                    required
                  />
                </div>
              </div>

              <div class="sign-up__row">
                <div class="sign-up__field">
                  <label class="sign-up__label" for="su-zip">Zip Code*</label>
                  <div class="sign-up__input-wrapper">
                    <input
                      id="su-zip"
                      class="sign-up__input"
                      type="text"
                      name="zip_code"
                      placeholder="Zip Code"
                      autocomplete="postal-code"
                      required
                    />
                  </div>
                </div>
                <div class="sign-up__field">
                  <label class="sign-up__label" for="su-location"
                    >Location*</label
                  >
                  <div class="sign-up__select-wrapper">
                    <i
                      class="fas fa-chevron-down sign-up__select-icon"
                      aria-hidden="true"
                    ></i>
                    <select
                      id="su-location"
                      class="sign-up__select"
                      name="location"
                      required
                    >
                      <option value="" disabled selected>Location</option>
                      <option value="new-york">New York</option>
                      <option value="los-angeles">Los Angeles</option>
                      <option value="chicago">Chicago</option>
                      <option value="houston">Houston</option>
                      <option value="phoenix">Phoenix</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="sign-up__field">
                <label class="sign-up__label" for="su-password"
                  >Create Password*</label
                >
                <div class="sign-up__input-wrapper">
                  <input
                    id="su-password"
                    class="sign-up__input"
                    type="password"
                    name="password"
                    placeholder="At Least 8 Characters"
                    autocomplete="new-password"
                    required
                  />
                  <button
                    type="button"
                    class="sign-up__eye-toggle"
                    aria-label="Show password"
                    data-target="su-password"
                  >
                    <i class="fas fa-lock" aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <div class="sign-up__field">
                <label class="sign-up__label" for="su-confirm-password"
                  >Confirm Password*</label
                >
                <div class="sign-up__input-wrapper">
                  <input
                    id="su-confirm-password"
                    class="sign-up__input"
                    type="password"
                    name="confirm_password"
                    placeholder="Re-Enter Your Password"
                    autocomplete="new-password"
                    required
                  />
                  <button
                    type="button"
                    class="sign-up__eye-toggle"
                    aria-label="Show confirm password"
                    data-target="su-confirm-password"
                  >
                    <i class="fas fa-lock" aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <button
                type="submit"
                class="common-btn common-btn--primary sign-up__submit-btn"
              >
                <span class="common-btn__inner">
                  Sign Up
                  <svg
                    class="common-btn__dash-svg"
                    viewBox="0 0 170 47"
                    preserveAspectRatio="none"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <rect
                      x="1.5"
                      y="1.5"
                      width="167"
                      height="44"
                      rx="22"
                      ry="22"
                    />
                  </svg>
                </span>
              </button>
            </form>

            <p class="sign-up__register-wrap">
              Don't Have An Account?
              <a href="sign-in.html" class="sign-up__register-link">Sign In</a>
            </p>
          </div>
        </div>

        <div class="sign-up__image-panel">
          <div class="sign-up__image-box">
            <img
              src="assets/img/sign-in/sign-in.png"
              alt="Pets"
              class="sign-up__image"
            />
          </div>
        </div>
      </div>
    </section>
    <!-- ================= End Sign Up ============================ -->

    <!-- Scripts -->
    <script src="assets/js/plugins/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="assets/js/plugins/lightgallery.min.js"></script>
    <script src="assets/js/plugins/simplePagination.min.js"></script>
    <script src="assets/js/plugins/aos.js"></script>
    <script src="assets/js/plugins/swiper.min.js"></script>
    <script src="assets/js/plugins/SplitText.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
