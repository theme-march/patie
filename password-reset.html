<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Thememarch" />
    <link rel="icon" href="assets/img/logo/favIcon.svg" />
    <title>Password Reset - Patie</title>
    <meta
      name="description"
      content="Reset your Patie account password. Enter the code sent to your email and create a new secure password to regain access."
    />
    <link rel="stylesheet" href="assets/css/plugins/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/plugins/fontawesome.min.css" />
    <link rel="stylesheet" href="assets/css/preloader.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>

    <!-- Preloader -->
    <div
      id="preloader"
      class="preloader"
      aria-hidden="true"
      role="presentation"
    >
      <div class="preloader__frames">
        
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf0" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf1" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf2" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf3" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf4" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf5" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf6" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf7" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf8" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf9" />
        </svg>
      </div>
    </div>

    <!-- ================= Password Reset ========================= -->
    <section class="password-reset">
      <img
        src="assets/img/forget-password/forget-password-bg.png"
        alt="forget password bg"
        class="password-reset__bg"
        aria-hidden="true"
      />
      <div class="password-reset__inner">
        <a
          href="index.html"
          class="password-reset__logo"
          aria-label="Patie Home"
        >
          <img
            src="assets/img/logo/dashboard-logo.svg"
            alt="Paties"
            width="220"
            height="52"
            class="object-cover"
          />
        </a>

        <h1 class="password-reset__title">Password Reset</h1>

        <p class="password-reset__description">
          We Sent A Code To Adminpaties@Gmail.Com
        </p>

        <form
          class="password-reset__form"
          action="#"
          method="post"
          novalidate
          aria-label="Password reset OTP"
        >
          <div
            class="password-reset__otp-group"
            role="group"
            aria-label="One-time password"
          >
            <input
              class="password-reset__otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              autocomplete="one-time-code"
              aria-label="Digit 1"
            />
            <input
              class="password-reset__otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              aria-label="Digit 2"
            />
            <input
              class="password-reset__otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              aria-label="Digit 3"
            />
            <input
              class="password-reset__otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              aria-label="Digit 4"
            />
            <input
              class="password-reset__otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              aria-label="Digit 5"
            />
            <input
              class="password-reset__otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              aria-label="Digit 6"
            />
            <input
              class="password-reset__otp-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]"
              aria-label="Digit 7"
            />
          </div>

          <button
            type="submit"
            class="common-btn common-btn--primary password-reset__submit-btn"
          >
            <span class="common-btn__inner"> Reset Password </span>
          </button>
        </form>

        <a href="sign-in.html" class="password-reset__back-link">
          <i class="fas fa-arrow-left ak-font-14" aria-hidden="true"></i>
          Back To Login
        </a>
      </div>
    </section>
    <!-- ================= End Password Reset ==================== -->

    <!-- Scripts -->
    <script src="assets/js/plugins/jquery-3.7.1.min.js"></script>
    <script src="assets/js/plugins/gsap.min.js"></script>
    <script src="assets/js/plugins/ScrollTrigger.min.js"></script>
    <script src="assets/js/plugins/aos.js"></script>
    <script src="assets/js/plugins/swiper.min.js"></script>
    <script src="assets/js/plugins/SplitText.min.js"></script>
    <script src="assets/js/paw-sprite.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
