<!doctype html>
<html class="no-js" lang="en">
  <head>
    <!-- Meta Tags -->
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Thememarch" />
    <meta name="description" content="Pet Care Services HTML Template" />
    <!-- Site Title -->
    <title>Patie - Pet Care Services HTML Template</title>
    <!-- Favicon Icon -->
    <link rel="icon" href="assets/img/logo/favIcon.svg" />

    <link rel="stylesheet" href="assets/css/preloader.css" />
    <link rel="stylesheet" href="assets/css/plugins/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/plugins/fontawesome.min.css" />
    <link rel="stylesheet" href="assets/css/plugins/aos.css" />
    <link rel="stylesheet" href="assets/css/plugins/swiper.min.css" />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>

    <!-- Preloader -->
    <div
      id="preloader"
      class="preloader"
      aria-hidden="true"
      role="presentation"
    >
      <div class="preloader__frames">
        
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf0" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf1" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf2" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf3" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf4" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf5" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf6" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf7" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf8" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="#pf9" />
        </svg>
      </div>
    </div>

    <!-- ================= Set New Password ======================== -->
    <section class="set-newpassword">
      <img
        src="assets/img/forget-password/forget-password-bg.png"
        alt="forget password bg"
        class="set-newpassword__bg"
        aria-hidden="true"
      />
      <div class="set-newpassword__inner">
        <a
          href="index.html"
          class="set-newpassword__logo"
          aria-label="Patie Home"
        >
          <img
            src="assets/img/logo/dashboard-logo.svg"
            alt="Paties"
            width="220"
            height="52"
            class="object-cover"
          />
        </a>
        <h1 class="set-newpassword__title">Set New Password</h1>
        <p class="set-newpassword__description">
          Must Be At Least 8 Characters
        </p>
        <form
          class="set-newpassword__form"
          action="#"
          method="post"
          novalidate
          aria-label="Set new password"
        >
          <div class="set-newpassword__input-wrapper">
            <label for="snp-password" class="set-newpassword__label">
              Password
            </label>
            <input
              id="snp-password"
              class="set-newpassword__input"
              type="password"
              name="password"
              placeholder="********"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="set-newpassword__input-wrapper">
            <label for="snp-confirm-password" class="set-newpassword__label">
              Confirm Password
            </label>
            <input
              id="snp-confirm-password"
              class="set-newpassword__input"
              type="password"
              name="confirm_password"
              placeholder="********"
              autocomplete="new-password"
              required
            />
          </div>
          <button
            type="submit"
            class="common-btn common-btn--primary set-newpassword__submit-btn"
          >
            <span class="common-btn__inner"> Reset Password </span>
          </button>
        </form>
        <a href="sign-in.html" class="set-newpassword__back-link">
          <i class="fas fa-arrow-left ak-font-14" aria-hidden="true"></i>
          Back To Login
        </a>
      </div>
    </section>
    <!-- ================= End Set New Password ==================== -->

    <!-- Script -->
    <script src="assets/js/plugins/jquery-3.7.1.min.js"></script>
    <script src="assets/js/plugins/gsap.min.js"></script>
    <script src="assets/js/plugins/ScrollTrigger.min.js"></script>
    <script src="assets/js/plugins/chart.umd.min.js"></script>
    <script src="assets/js/plugins/chartjs-plugin-datalabels.min.js"></script>
    <script src="assets/js/plugins/aos.js"></script>
    <script src="assets/js/plugins/swiper.min.js"></script>
    <script src="assets/js/plugins/SplitText.min.js"></script>
    <script src="assets/js/paw-sprite.js"></script>

    <script src="assets/js/main.js"></script>
  </body>
</html>
