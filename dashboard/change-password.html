<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Thememarch" />
    <link rel="icon" href="../assets/img/logo/favIcon.svg" />
    <title>Change Password – Patie Dashboard</title>
    <link rel="stylesheet" href="../assets/css/plugins/bootstrap.min.css" />
    <link rel="stylesheet" href="../assets/css/plugins/fontawesome.min.css" />
    <link rel="stylesheet" href="../assets/css/preloader.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <!-- Preloader -->
    <div id="preloader" class="preloader" aria-hidden="true" role="presentation">
      <div class="preloader__frames">
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf0" /></svg>
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf1" /></svg>
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf2" /></svg>
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf3" /></svg>
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf4" /></svg>
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf5" /></svg>
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf6" /></svg>
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf7" /></svg>
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf8" /></svg>
        <svg class="preloader__frame" aria-hidden="true"><use href="../assets/img/preloader/paw-frames.svg#pf9" /></svg>
      </div>
    </div>

    <!-- ================= Change Password Dashboard ======================== -->
    <div class="dashboard">

      <!-- ── Topbar ─────────────────────────────────────────── -->
      <header class="dashboard-topbar" role="banner">
        <div class="dashboard-topbar__logo-slot">
          <a href="../index.html" class="dashboard-topbar__logo-link" aria-label="Patie Home">
            <img
              src="../assets/img/logo/dashboard-logo.svg"
              alt="Paties"
              width="160"
              height="38"
              class="dashboard-topbar__logo-img"
            />
          </a>
        </div>

        <div class="dashboard-topbar__right">
          <div class="dashboard-topbar__search-wrap">
            <label for="cp-topbar-search" class="visually-hidden">Search</label>
            <input
              id="cp-topbar-search"
              class="dashboard-topbar__search-input"
              type="search"
              placeholder="Search"
              autocomplete="off"
            />
            <i class="fas fa-search dashboard-topbar__search-icon" aria-hidden="true"></i>
          </div>

          <div class="dashboard-topbar__actions">
            <a href="#" class="dashboard-topbar__action-btn" aria-label="Messages">
              <i class="fas fa-comment-dots" aria-hidden="true"></i>
            </a>
            <a href="#" class="dashboard-topbar__action-btn" aria-label="Notifications">
              <i class="fas fa-bell" aria-hidden="true"></i>
            </a>
            <a href="#" class="dashboard-topbar__action-btn" aria-label="Settings">
              <i class="fas fa-cog" aria-hidden="true"></i>
            </a>
            <a href="#" class="dashboard-topbar__action-btn" aria-label="Apps">
              <i class="fas fa-th" aria-hidden="true"></i>
            </a>
            <img
              src="../assets/img/dashboard/profile-pic.png"
              alt="Profile"
              class="dashboard-topbar__avatar"
              width="42"
              height="42"
            />
          </div>
        </div>
      </header>

      <!-- ── Body row ───────────────────────────────────────── -->
      <div class="dashboard-body-row">

        <!-- ── Sidebar ────────────────────────────────────── -->
        <aside class="dashboard-sidebar" aria-label="Sidebar navigation">

          <div class="dashboard-sidebar__avatar-wrap">
            <img
              src="../assets/img/dashboard/profile-pic.png"
              alt="Nocturne Nyx"
              class="dashboard-sidebar__avatar"
              width="110"
              height="110"
            />
          </div>

          <div class="dashboard-sidebar__group">

            <div class="dashboard-sidebar__profile">
              <p class="dashboard-sidebar__name">Nocturne Nyx</p>
              <p class="dashboard-sidebar__email">Realdrewcone@Test.Com</p>
            </div>

            <nav class="dashboard-sidebar__nav" aria-label="Dashboard menu">
              <a href="../dashboard.html" class="dashboard-sidebar__nav-item">
                <i class="fas fa-home dashboard-sidebar__nav-icon" aria-hidden="true"></i>
                Dashboard
              </a>
              <a href="order.html" class="dashboard-sidebar__nav-item">
                <i class="fas fa-shopping-bag dashboard-sidebar__nav-icon" aria-hidden="true"></i>
                Order
              </a>
              <a href="change-password.html" class="dashboard-sidebar__nav-item dashboard-sidebar__nav-item--active" aria-current="page">
                <i class="fas fa-lock dashboard-sidebar__nav-icon" aria-hidden="true"></i>
                Change Password
              </a>
              <a href="lead-management.html" class="dashboard-sidebar__nav-item">
                <i class="fas fa-user-tie dashboard-sidebar__nav-icon" aria-hidden="true"></i>
                Lead Management
              </a>
            </nav>

            <a href="../sign-in.html" class="dashboard-sidebar__logout">
              <i class="fas fa-sign-out-alt dashboard-sidebar__logout-icon" aria-hidden="true"></i>
              Logout
            </a>

          </div>
        </aside>

        <!-- ── Main content ───────────────────────────────── -->
        <div class="cp-page">
          <main class="cp-body" id="main-content">

            <div class="cp-card">
              <!-- Title -->
              <h1 class="cp-card__title">Create A New Password</h1>

              <!-- Form -->
              <form
                class="cp-form"
                action="#"
                method="post"
                novalidate
                aria-label="Change password form"
              >
                <!-- Current Password -->
                <div class="cp-form__field">
                  <label for="cp-current" class="cp-form__label cp-form__label--required">
                    Current Password
                  </label>
                  <input
                    id="cp-current"
                    class="cp-form__input"
                    type="password"
                    name="current_password"
                    autocomplete="current-password"
                    required
                  />
                </div>

                <!-- New Password -->
                <div class="cp-form__field">
                  <label for="cp-new" class="cp-form__label">
                    New Password
                  </label>
                  <input
                    id="cp-new"
                    class="cp-form__input"
                    type="password"
                    name="new_password"
                    autocomplete="new-password"
                    required
                  />
                </div>

                <!-- Confirm Password -->
                <div class="cp-form__field">
                  <label for="cp-confirm" class="cp-form__label">
                    Confirm Password
                  </label>
                  <input
                    id="cp-confirm"
                    class="cp-form__input"
                    type="password"
                    name="confirm_password"
                    autocomplete="new-password"
                    required
                  />
                </div>

                <!-- Actions -->
                <div class="cp-form__actions">
                  <a href="../dashboard.html" class="cp-form__cancel-btn">
                    Cancel
                  </a>
                  <button type="submit" class="cp-form__submit-btn">
                    Update Password
                  </button>
                </div>
              </form>
            </div>

          </main>

          <!-- Footer -->
          <footer class="cp-footer">
            Copyright &copy; 2026 <a href="../index.html" class="cp-footer__link">Patie</a> All Rights Reserved.
          </footer>
        </div>
        <!-- /cp-page -->

      </div>
      <!-- /dashboard-body-row -->

    </div>
    <!-- /dashboard -->

    <!-- Scripts -->
    <script src="../assets/js/plugins/jquery-3.7.1.min.js"></script>
    <script src="../assets/js/plugins/aos.js"></script>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
