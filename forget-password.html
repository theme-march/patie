<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Thememarch" />
    <link rel="icon" href="assets/img/logo/favIcon.svg" />
    <title>Forgot Password – Patie</title>
    <link rel="stylesheet" href="assets/css/plugins/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/plugins/fontawesome.min.css" />
    <link rel="stylesheet" href="assets/css/preloader.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- Preloader -->
    <div
      id="preloader"
      class="preloader"
      aria-hidden="true"
      role="presentation"
    >
      <div class="preloader__frames">
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf0" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf1" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf2" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf3" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf4" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf5" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf6" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf7" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf8" />
        </svg>
        <svg class="preloader__frame" aria-hidden="true">
          <use href="assets/img/preloader/paw-frames.svg#pf9" />
        </svg>
      </div>
    </div>

    <!-- ================= Forgot Password ======================== -->
    <section class="forget-password">
      <img
        src="assets/img/forget-password/forget-password-bg.png"
        alt=""
        class="forget-password__bg"
        aria-hidden="true"
      />
      <div class="forget-password__inner">
        <!-- Logo -->
        <a
          href="index.html"
          class="forget-password__logo"
          aria-label="Patie Home"
        >
          <img
            src="assets/img/logo/dashboard-logo.svg"
            alt="Paties"
            width="220"
            height="52"
            class="object-cover"
          />
        </a>

        <!-- Title -->
        <h1 class="forget-password__title">Forgot Password?</h1>

        <!-- Description -->
        <p class="forget-password__description">
          No Worries, We'll Send You Reset Instructions.
        </p>

        <!-- Form -->
        <form
          class="forget-password__form"
          action="#"
          method="post"
          novalidate
          aria-label="Forgot password"
        >
          <!-- Email -->
          <div class="forget-password__input-wrapper">
            <input
              id="fp-email"
              class="forget-password__input"
              type="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required
            />
          </div>

          <!-- Submit button -->
          <button
            type="submit"
            class="common-btn common-btn--primary forget-password__submit-btn"
          >
            <span class="common-btn__inner"> Reset Password </span>
          </button>
        </form>

        <!-- Back to login -->
        <a href="sign-in.html" class="forget-password__back-link">
          <i class="fas fa-arrow-left ak-font-14" aria-hidden="true"></i>
          Back To Login
        </a>
      </div>
    </section>
    <!-- ================= End Forgot Password ==================== -->

    <!-- Scripts -->
    <script src="assets/js/plugins/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="assets/js/plugins/lightgallery.min.js"></script>
    <script src="assets/js/plugins/simplePagination.min.js"></script>
    <script src="assets/js/plugins/aos.js"></script>
    <script src="assets/js/plugins/swiper.min.js"></script>
    <script src="assets/js/plugins/SplitText.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
